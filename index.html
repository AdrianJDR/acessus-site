/* horários fictícios, gerados de forma determinística a partir do id do profissional */
const slotsFor=s=>{const seed=s.id.charCodeAt(1),T=['08:00','08:40','09:20','10:00','10:40','13:30','14:10','14:50','15:30','16:10'],out=[];let d=new Date(),n=0;
while(out.length<4){d=new Date(d.getTime()+864e5);if(d.getDay()%6===0)continue;n++;out.push({k:d.toISOString().slice(0,10),d:new Date(d),ts:T.filter((_,i)=>(i+seed+n)%3===0).slice(0,4)})}return out};
const fday=d=>d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'}).replace('.','');
function SpecModal({s,U,close}){const S=useMemo(()=>slotsFor(s),[s]);const[di,setDi]=useState(0),[tm,setTm]=useState(''),[f,setF]=useState({nome:'',contato:'',motivo:''}),[ok,setOk]=useState(null);

return h`<${Modal} t=${s.nome} close=${close}>
<p className="text-sm"><b>Especialidade:</b> ${s.esp}<br/><b>Unidade (fictícia):</b> ${un(U,s.u)}</p>
${ok?h`<div role="status" className="space-y-3 rounded-xl bg-mint/20 p-4 text-sm text-navy"><p className="font-extrabold">Solicitação simulada registrada</p><p>${s.nome} · ${fday(ok.d)} às ${ok.t}<br/>${un(U,s.u)}</p><p className="text-xs">Nenhum dado foi enviado ou armazenado: esta é apenas uma demonstração.</p><button type="button" className=${bS+' !py-2'} onClick=${()=>{setOk(null);setTm('');setF({nome:'',contato:'',motivo:''})}}>Nova solicitação</button></div>`
:h`<div><h3 className="font-bold text-navy">Horários disponíveis (fictícios)</h3>
<div className="mt-2 flex flex-wrap gap-2" role="tablist" aria-label="Dias">${S.map((x,i)=>h`<button key=${x.k} type="button" role="tab" aria-selected=${i===di} onClick=${()=>{setDi(i);setTm('')}} className=${'rounded-lg px-3 py-1.5 text-xs font-bold capitalize transition '+(i===di?'bg-brand text-white':'bg-bg text-navy hover:text-brand')}>${fday(x.d)}</button>`)}</div>
<div className="mt-3 flex flex-wrap gap-2" role="group" aria-label="Horários">${day.ts.map(t=>h`<button key=${t} type="button" aria-pressed=${tm===t} onClick=${()=>setTm(t)} className=${'inline-flex items-center gap-1.5 rounded-lg border px-3 py-1.5 text-sm font-semibold transition '+(tm===t?'border-brand bg-brand text-white':'border-slate-200 bg-white text-navy hover:border-brand')}><${I} n="clock" c="h-3.5 w-3.5"/>${t}</button>`)}</div></div>
<form onSubmit=${submit} className="space-y-3 border-t border-slate-100 pt-4"><h3 className="font-bold text-navy">Marcar consulta</h3>
<${Field} l="Nome completo"><input required className=${inp} value=${f.nome} onChange=${set('nome')} placeholder="Nome fictício para teste"/><//>
<${Field} l="Telefone ou e-mail"><input required className=${inp} value=${f.contato} onChange=${set('contato')} placeholder="Contato fictício"/><//>
<${Field} l="Motivo da consulta (opcional)"><textarea rows="2" className=${inp} value=${f.motivo} onChange=${set('motivo')}/><//>
<p className="text-sm text-slate-600">${tm?h`Horário escolhido: <b className="text-navy">${fday(day.d)} às ${tm}</b>`:'Escolha um horário acima para continuar.'}</p>
<button type="submit" disabled=${!tm} className=${bP+' w-full disabled:cursor-not-allowed disabled:opacity-50'}>Marcar consulta</button></form>`}
<${Sim}>Profissional, horários e agendamento são fictícios. Os dados digitados não saem do seu navegador e não são armazenados.<//><//>`}
function Specs(){const D=useAsync(svc.especialistas),U=useAsync(svc.unidades);const[q,sq]=useState(''),[e,se]=useState(''),[u,su]=useState(''),[sel,setSel]=useState(null);

function About({go}){return h`<div><${Head} t="Sobre o AcesSus" d="Acesso Inteligente à Saúde Pública."/><div className="mx-auto max-w-6xl space-y-12 px-4 py-10"><p className="max-w-3xl text-lg text-slate-700">O AcesSus pretende facilitar o acesso da população às informações dos serviços públicos de saúde, reunindo dados de diferentes fontes em uma interface simples e intuitiva.</p>

<${Sim}>Estado atual: protótipo frontend com dados simulados. Não há integração com CNES, sistemas de estoque ou Meu SUS Digital; qualquer integração futura depende de viabilidade técnica, autorização e condições institucionais.<//><button className=${bP} onClick=${()=>go('medicamentos')}>Explorar o protótipo</button></div></div>`}
/* ===== APP (roteamento por hash) ===== */
const nav=[['inicio','Início'],['medicamentos','Medicamentos'],['unidades','Unidades de Saúde'],['especialistas','Especialistas'],['sobre','Sobre']];

return h`<div className="flex min-h-screen flex-col"><div className="flex items-center justify-center gap-2 bg-amber-100 px-4 py-1.5 text-center text-xs font-semibold text-amber-900"><${I} n="flask" c="h-3.5 w-3.5 shrink-0"/>PROTÓTIPO — todos os dados exibidos são simulados e não representam informações reais do SUS.</div>
<header className="sticky top-0 z-40 border-b border-slate-200 bg-white/95 backdrop-blur"><div className="mx-auto flex max-w-6xl items-center justify-between px-4 py-3"><button onClick=${()=>go('inicio')} className="flex items-center gap-2 text-xl font-extrabold text-navy"><span className="grid h-9 w-9 place-items-center rounded-xl bg-brand text-white"><${I} n="heart"/></span><span>Aces<span className="text-brand">Sus</span></span></button>
